# Teste manual: amplia um trecho de um corte com IA (Real-ESRGAN) para comparar a nitidez.
name: Teste de ampliação por IA

on:
  workflow_dispatch:
    inputs:
      video:
        description: "URL do vídeo do corte"
        required: true
      inicio:
        description: "Segundo inicial do trecho"
        default: "10"
      duracao:
        description: "Duração do trecho em segundos"
        default: "10"

jobs:
  ampliar:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Instalar ffmpeg e Vulkan por CPU
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg mesa-vulkan-drivers libvulkan1 vulkan-tools unzip
          vulkaninfo --summary | head -20 || true
      - name: Baixar Real-ESRGAN
        run: |
          curl -sSL -o r.zip https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.5.0/realesrgan-ncnn-vulkan-20220424-ubuntu.zip
          mkdir -p esr && unzip -q r.zip -d esr && chmod +x esr/realesrgan-ncnn-vulkan && ls esr esr/models
      - name: Ampliar o trecho
        env:
          VIDEO: ${{ inputs.video }}
          INICIO: ${{ inputs.inicio }}
          DURACAO: ${{ inputs.duracao }}
        run: |
          curl -sSL -o corte.mp4 "$VIDEO"
          ffmpeg -v error -y -ss "$INICIO" -t "$DURACAO" -i corte.mp4 -c:v libx264 -crf 12 -c:a copy trecho.mp4
          mkdir -p q a
          # Volta ao tamanho que a câmera de fato gravou (o corte já foi ampliado ~2,5x) antes da IA.
          ffmpeg -v error -y -i trecho.mp4 -vf "scale=432:768:flags=area" q/%05d.png
          time ./esr/realesrgan-ncnn-vulkan -i q -o a -n realesrgan-x4plus -s 4 -f png -j 2:2:2
          ffmpeg -v error -y -framerate 24000/1001 -i a/%05d.png -i trecho.mp4 -map 0:v -map 1:a \
            -vf "scale=1080:1920:flags=lanczos" -c:v libx264 -preset slow -crf 17 -pix_fmt yuv420p \
            -c:a aac -b:a 160k -movflags +faststart ia.mp4
          ffmpeg -v error -y -i trecho.mp4 -i ia.mp4 -filter_complex "[0:v][1:v]hstack" -map 1:a \
            -c:v libx264 -crf 18 -pix_fmt yuv420p -c:a copy lado-a-lado.mp4
          ls -la *.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: ampliacao
          path: |
            ia.mp4
            lado-a-lado.mp4
