# Manual: melhora a nitidez de cortes já publicados (um job por corte, em paralelo).
name: Nitidez dos cortes

on:
  workflow_dispatch:
    inputs:
      cortes:
        description: 'Lista JSON de ids, ex.: ["id1","id2"]'
        required: true

jobs:
  melhorar:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        corte: ${{ fromJSON(inputs.cortes) }}
    steps:
      - uses: actions/checkout@v4
      - name: Instalar ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Melhorar
        env:
          SUPABASE_URL: https://fznihnlsnshbkfkkisvg.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python3 scripts/cortes/nitidez.py "${{ matrix.corte }}"
