# Robô de cortes: acordado pelo site quando um painel tem vídeo e trechos escolhidos pela IA.
name: Cortes de vídeo

on:
  workflow_dispatch:
    inputs:
      painel:
        description: "Slug do painel (ex.: painel-1)"
        required: true

concurrency:
  group: cortes-${{ inputs.painel }}
  cancel-in-progress: false

jobs:
  cortar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Liberar disco (vídeo do painel inteiro pode ter 10 GB ou mais)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar ffmpeg e dependências
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          pip install --quiet "numpy<2" google-auth requests
      - name: Instalar o removedor de ruído de voz (DeepFilterNet)
        continue-on-error: true
        run: |
          pip install --quiet torch==2.0.1 torchaudio==2.0.2 --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet deepfilternet==0.5.6
          deepFilter --help > /dev/null && echo "DeepFilterNet pronto"
      - name: Cortar
        env:
          SUPABASE_URL: https://fznihnlsnshbkfkkisvg.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python scripts/cortes/cortar.py "${{ inputs.painel }}"
